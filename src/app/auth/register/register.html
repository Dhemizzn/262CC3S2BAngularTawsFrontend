<form class="auth-card p-4 p-md-5 ">
    <h2 class="text-center mt-0 mb-4 fw-bold">Registro</h2>
    
    <div class="row">
        <div class="col-md-4 mb-3">
            <label for="name" class="form-label fw-medium">Nombre</label>
            <input class="form-control" type="text" id="name" placeholder="Ingrese su nombre">    
        </div>        

        <div class="col-md-4 mb-3">
            <label for="lastn" class="form-label fw-medium">Apellidos</label>
            <input class="form-control" type="text" id="lastn" placeholder="Ingrese sus Apellidos">
        </div>

        <div class="col-md-4 mb-3">
            <label for="dni" class="form-label fw-medium">DNI</label>
            <input class="form-control" type="text" id="dni" inputmode="numeric" placeholder="Ingrese su DNI">
        </div>

        <div class="col-md-4 mb-3">
            <label for="email" class="form-label fw-medium">Correo Electrónico</label>
            <input class="form-control" type="email" id="email" placeholder="Ingrese su correo">
        </div>

        <div class="col-md-4 mb-3">
            <label for="telefono" class="form-label fw-medium">Teléfono</label>
            <input class="form-control" type="text" id="telefono" inputmode="numeric" placeholder="Ingrese su teléfono">
        </div>

        <div class="col-md-4 mb-3">
            <label for="direction" class="form-label fw-medium">Dirección</label>
            <input class="form-control" type="text" id="direction" placeholder="Ingrese su dirección">
        </div>            
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-4">
        <button type="submit" class="bttn bttn-primary" id="register">Registrarse</button>
        <a routerLink="/login" class="bttn bttn-secondary text-decoration-none">Regresar</a>
    </div>
</form>
