<section class="auth-card">
    <h2 class ="text-center">Registro</h2>
    <div class="row">
            <div class="col-md-4 mb-3">
                <label>Nombre</label>
                <input type="text" id="name" placeholder="Ingrese su nombre">    
            </div>        

            <div class="col-md-4 mb-3">
                <label>Apellidos</label>
                <input type="text" id="lastn" placeholder="Ingrese sus Apellidos">
            </div>

            <div class="col-md-4 mb-3">
                <label>Dni</label>
                <input type="text" id="dni" inputmode="numeric" placeholder="Ingrese su DNI">
            </div>

            <div class="col-md-4 mb-3">
                <label>Correo Electrónico</label>
                <input type="email" id="email" placeholder="Ingrese su correo">
            </div>

            <div class="col-md-4 mb-3">
                <label>Teléfono</label>
                <input type="text" id="telefono" inputmode="numeric" placeholder="Ingrese su teléfono">
            </div>

            <div class="col-md-4 mb-3">
                <label>Dirección</label>
                <input type="text" id="direction" placeholder="Ingrese su dirección">
            </div>            
    </div>

    <div class="d-flex justify-content-between">
            <button routerLink="/login" class="bttn bttn-primary" id="register">Registrarse</button>
            <button routerLink="/login" class="bttn bttn-secondary">Regresar</button>
    </div>

</section>
