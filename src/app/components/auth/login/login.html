<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card p-4 p-md-5">
  <h2 class="text-center mt-0 mb-4 fw-bold">Inicio de sesión</h2>
  <div class="mb-3">
    <label for="email" class="form-label fw-medium">Correo electrónico</label>
    <input type="email" id="email" class="form-control" formControlName="email" placeholder="Ingrese su correo electrónico" (input)="filterEmail($event)" (keydown.enter)="focusNextField($event)" />
  </div>
  <div class="mb-4">
    <label for="password" class="form-label fw-medium">Contraseña</label>
    <div class="input-group">
      <input [type]="mostrarPassword ? 'text' : 'password'" id="password" class="form-control" formControlName="password" placeholder="Ingrese su contraseña" />
      <button type="button" class="btn password-toggle" (click)="togglePasswordVisibility()" [attr.aria-label]="mostrarPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
        <i [class]="mostrarPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
      </button>
    </div>
    <div class="text-end mt-2">
      <a routerLink="/recovery" class="text-decoration-none small">¿Olvidaste tu contraseña?</a>
    </div>
  </div>
  <div class="d-flex flex-column gap-2 align-items-center mt-2">
    <button type="submit" id="login" class="bttn bttn-primary w-100">Iniciar sesión</button>
    <p class="mb-0 mt-3 text-muted">
      ¿Aún no tienes cuenta? <a routerLink="/register" class="text-decoration-none fw-semibold">Créala aquí</a>
    </p>
  </div>
</form>
