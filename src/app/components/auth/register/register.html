<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card p-4 p-md-5">
  <h2 class="text-center mt-0 mb-4 fw-bold">Registro</h2>

  <div class="row">
    <div class="col-md-4 mb-3">
      <label for="name" class="form-label fw-medium">Nombre</label>
      <input 
        type="text" 
        id="name" 
        class="form-control" 
        formControlName="firstName" 
        placeholder="Ingrese su nombre"
        (input)="filterInput($event, 'firstName', 'name')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="lastnP" class="form-label fw-medium">Apellido Paterno</label>
      <input 
        type="text" 
        id="lastnP" 
        class="form-control" 
        formControlName="lastNameP" 
        placeholder="Ingrese su apellido paterno"
        (input)="filterInput($event, 'lastNameP', 'name')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="lastnM" class="form-label fw-medium">Apellido Materno</label>
      <input 
        type="text" 
        id="lastnM" 
        class="form-control" 
        formControlName="lastNameM" 
        placeholder="Ingrese su apellido materno"
        (input)="filterInput($event, 'lastNameM', 'name')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="dni" class="form-label fw-medium">DNI</label>
      <input 
        type="text" 
        id="dni" 
        class="form-control" 
        formControlName="dni" 
        placeholder="Ingrese su DNI"
        maxlength="8" 
        inputmode="numeric" 
        (input)="filterInput($event, 'dni', 'number')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="email" class="form-label fw-medium">Correo Electrónico</label>
      <input 
        type="email" 
        id="email" 
        class="form-control" 
        formControlName="email" 
        placeholder="Ingrese su correo"
        (input)="filterInput($event, 'email', 'email')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="telefono" class="form-label fw-medium">Teléfono</label>
      <input 
        type="text" 
        id="telefono" 
        class="form-control" 
        formControlName="phone" 
        placeholder="Ingrese su teléfono"
        maxlength="9" 
        inputmode="numeric" 
        (input)="filterInput($event, 'phone', 'number')" 
      />
    </div>

    <div class="col-md-4 mb-3">
      <label for="direction" class="form-label fw-medium">Dirección</label>
      <input 
        type="text" 
        id="direction" 
        class="form-control" 
        formControlName="direction" 
        placeholder="Ingrese su dirección"
        (input)="filterInput($event, 'direction', 'address')" 
      />
    </div>
  </div>

  <div class="d-flex flex-column flex-md-row justify-content-between gap-2 mt-4">
    <button type="submit" id="register" class="bttn bttn-primary">
      Registrarse
    </button>
    <a routerLink="/login" class="bttn bttn-secondary text-decoration-none">
      Regresar
    </a>
  </div>
</form>
