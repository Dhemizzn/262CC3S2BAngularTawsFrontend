
<form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-card">

  <h2 class="text-center fw-bold">Olvidaste tu contraseña</h2>

  <p>
    Ingresa la dirección de correo electrónico a la que
    deseas que se envíe la información para restablecer tu contraseña.
  </p>

  <div class="mb-3">
    <label class="form-label" for="email">
      Ingrese su dirección de correo electrónico
    </label>

    <input
      class="form-control"
      type="email"
      id="email"
      formControlName="email"
      placeholder="Ingrese su correo electrónico"
      maxlength="40"
      autocomplete="email"
      (input)="filterEmail($event)"
    />
  </div>

  <div class="d-flex justify-content-between">
    <button
      type="submit"
      class="bttn bttn-primary"
      id="recovery"
    >
      Recuperar
    </button>

    <button
      type="button"
      routerLink="/login"
      class="bttn bttn-secondary"
    >
      Regresar
    </button>
  </div>

</form>
