<div class="row justify-content-center mt-3">
  <div class="col-12 col-xxl-10">
    
    <div class="card shadow border-0">
      <div class="card-header bg-secondary text-white p-4 d-flex justify-content-between align-items-center">
        <div>
          <h3 class="mb-0 fs-5">Mis Cotizaciones</h3>
          <p class="mb-0 text-light small mt-1">Historial de solicitudes y paquetes propuestos por el agente.</p>
        </div>
      </div>
      
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
              <tr>
                <th scope="col" class="ps-4">Código</th>
                <th scope="col">Destino</th>
                <th scope="col">Fecha de Partida</th>
                <th scope="col">Estado</th>
                <th scope="col" class="text-center pe-4">Acciones</th>
              </tr>
            </thead>
            <tbody>
              
              <tr *ngFor="let cot of cotizaciones">
                <td class="ps-4 fw-bold text-secondary">{{ cot.id }}</td>
                <td>{{ cot.destino }}</td>
                <td>{{ cot.fechaPartida | date:'dd/MM/yyyy HH:mm' }}</td>
                <td>
                  <span class="badge rounded-pill px-3 py-2" [ngClass]="getEstadoClase(cot.estado)">
                    {{ cot.estado }}
                  </span>
                </td>
                <td class="text-center pe-4">
                  <button class="btn btn-sm btn-outline-primary" title="Ver Detalle">
                    <i class="bi bi-eye"></i> Ver Detalle
                  </button>
                </td>
              </tr>

              <tr *ngIf="cotizaciones.length === 0">
                <td colspan="5" class="text-center py-5 text-muted">
                  <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                  No tienes cotizaciones registradas en este momento.
                </td>
              </tr>

            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>
