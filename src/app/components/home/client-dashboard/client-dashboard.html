<div class="container-fluid">
  <div class="row">
    
    <nav class="col-md-3 col-lg-2 d-md-block bg-white sidebar shadow-sm min-vh-100 d-flex flex-column">
      <div class="position-sticky pt-5 mt-3 px-2 w-100 d-flex flex-column h-100">
        <div class="px-3 py-2 mb-3 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-3 text-secondary"></i>
            <div class="text-truncate">
              <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.68rem; letter-spacing: 0.5px;">Portal del Socio</small>
              <span class="fw-bold text-dark fs-6">¡Hola, {{ firstName }}!</span>
            </div>
          </div>
        </div>
        
        <ul class="nav flex-column gap-2">
          <li class="nav-item">
            <a class="nav-link active rounded d-flex align-items-center" routerLink="nueva-cotizacion">
              <i class="bi bi-file-earmark-plus fs-5 me-2"></i> Nueva Cotización
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark rounded d-flex align-items-center" routerLink="mis-cotizaciones">
              <i class="bi bi-card-list fs-5 me-2"></i> Mis Cotizaciones
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link text-dark rounded d-flex align-items-center" routerLink="mis-pagos">
              <i class="bi bi-credit-card fs-5 me-2"></i> Mis Pagos
            </a>
          </li>
        </ul>

        <hr class="my-4 mt-auto">
        
        <div class="px-2 pb-5">
          <button type="button" class="btn btn-outline-danger w-100" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4 bg-light main-content min-vh-100 d-flex flex-column justify-content-center">
        <router-outlet></router-outlet> 
    </main>

  </div>
</div>
