<div class="container-fluid">
  <div class="row">
    
    <nav class="col-md-3 col-lg-2 d-none d-md-flex bg-white sidebar shadow-sm flex-column">
      <div class="position-sticky pt-5 mt-3 px-2 w-100 d-flex flex-column flex-grow-1">
        
        <div class="px-3 py-2 mb-3 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <i class="bi bi-person-circle fs-3 text-secondary"></i>
            <div class="text-truncate">
              <small class="text-muted d-block text-uppercase fw-bold" style="font-size: 0.68rem; letter-spacing: 0.5px;">
                {{ roleLabel }}
              </small>
              <span class="fw-bold text-dark fs-6">¡Hola, {{ firstName }}!</span>
            </div>
          </div>
        </div>
        
        <ul class="nav flex-column gap-2">
          @for (item of menuItems; track item.urlPath) {
            <li class="nav-item">
              <a class="nav-link text-dark rounded d-flex align-items-center"
                 [routerLink]="item.urlPath"
                 routerLinkActive="active bg-light fw-bold text-primary"
                 [routerLinkActiveOptions]="{ exact: false }">
                <i class="bi {{ item.icon || 'bi-folder' }} fs-5 me-2"></i>
                {{ item.moduleName }}
              </a>
            </li>
          }
        </ul>

        <hr class="my-4 mt-auto">
        
        <div class="px-2 pb-3">
          <button type="button" class="btn btn-outline-danger w-100" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
          </button>
        </div>
      </div>
    </nav>

    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 pt-5 mt-4 pb-4 bg-light main-content d-flex flex-column">
      <router-outlet></router-outlet> 
    </main>

  </div>
</div>
